spring.application.name=Shopping

# Die eine Datei, in der alles steht: Liste, Gerichte, Regeln.
shopping.data-file=data/shopping.json

# --- Netz ------------------------------------------------------------------
# Interner Port, nur localhost; nginx terminiert TLS. Ein Pfad unter
# fherrmann.com, keine Subdomain - kein DNS, kein Zertifikat.
server.port=48220
server.address=127.0.0.1
server.servlet.context-path=/shopping-list
server.forward-headers-strategy=framework

# --- Zugang ------------------------------------------------------------------
# NICHT der Privat-Token von fherrmann.com: dieser Dienst hat eigene Token,
# je Person einer, damit eine zweite Person die Liste bedienen kann - und
# sonst nichts. Form: name:token,name:token. Der Name steht spaeter an den
# Eintraegen ("abgehakt von felix"). Die echten Werte kommen ueber
# /etc/shopping.env; die Vorgabe hier ist nur fuer lokal.
shopping.tokens=${SHOPPING_TOKENS:felix:changeme-felix,freundin:changeme-freundin}

# --- Zeit ----------------------------------------------------------------------
shopping.zone=Europe/Berlin

# Abgehakte Eintraege bleiben bis Mitternacht sichtbar, danach nur noch in
# der Datei - und nach so vielen Tagen auch dort nicht mehr.
shopping.history-days=90

# Wie oft nachgesehen wird, ob eine Regel ("Klopapier alle 14 Tage") etwas
# auf die Liste setzen soll (Millisekunden). Zusaetzlich beim Start und
# direkt nach jedem Anlegen einer Regel.
shopping.recurring.check-interval=3600000
