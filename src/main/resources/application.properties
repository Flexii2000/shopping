spring.application.name=Shopping

# Die eine Datei, in der alles steht: Liste, Rezepte, Regeln.
shopping.data-file=data/shopping.json

# Die Gespraeche des Rezept-Chats, je Person eines. Bewusst eine eigene Datei: ein
# kaputter Verlauf darf die Liste nicht mitreissen.
shopping.chat-file=data/recipe-chat.json

# --- Netz ------------------------------------------------------------------
# Interner Port, nur localhost; nginx terminiert TLS. Ein Pfad unter
# fherrmann.com, keine Subdomain - kein DNS, kein Zertifikat.
server.port=48220
server.address=127.0.0.1
server.servlet.context-path=/shopping-list
server.forward-headers-strategy=framework

# --- Zugang ------------------------------------------------------------------
# NICHT der Privat-Token von fherrmann.com: dieser Dienst hat eigene Token,
# je Person einer, damit eine zweite Person die Liste bedienen kann - und
# sonst nichts. Form: name:token,name:token. Der Name steht spaeter an den
# Eintraegen ("abgehakt von felix"). Die echten Werte kommen ueber
# /etc/shopping.env; die Vorgabe hier ist nur fuer lokal.
shopping.tokens=${SHOPPING_TOKENS:felix:changeme-felix,joana:changeme-joana}

# --- Zeit ----------------------------------------------------------------------
shopping.zone=Europe/Berlin

# Abgehakte Eintraege bleiben bis Mitternacht sichtbar, danach nur noch in
# der Datei - und nach so vielen Tagen auch dort nicht mehr.
shopping.history-days=90

# Wie oft nachgesehen wird, ob eine Regel ("Klopapier alle 14 Tage") etwas
# auf die Liste setzen soll (Millisekunden). Zusaetzlich beim Start und
# direkt nach jedem Anlegen einer Regel.
shopping.recurring.check-interval=3600000

# --- Rezept-Chat ---------------------------------------------------------------
# Eine Claude-Code-Session auf dem Server beantwortet den Chat (deploy/recipe-agent,
# eingerichtet von deploy/setup-recipes.sh). Leer heisst: kein Chat - alles andere
# an den Rezepten geht trotzdem. Auf dem Server:
#   /usr/bin/sudo -n -u flexii /home/flexii/services/recipe-agent/run-agent.sh
shopping.recipe-agent.command=${SHOPPING_RECIPE_AGENT_COMMAND:}
# Wer den Chat benutzen darf: Namen aus SHOPPING_TOKENS mit Komma, * fuer alle.
# Leer heisst niemand - jede Antwort zaehlt auf Felix' Claude-Kontingent.
shopping.recipe-agent.people=${SHOPPING_RECIPE_CHAT:}
shopping.recipe-agent.timeout-seconds=120
# So viele Nachrichten je Person und Tag.
shopping.recipe-agent.daily-limit=40
# Beim Start einmal "<kommando> --version" - beweist, dass der Dienst den Agenten
# wirklich starten darf (sudo unter den Bedingungen der Unit).
shopping.recipe-agent.probe=true

# --- Kochen: das Rezept im Kalorienzaehler -------------------------------------
# "Kochen" legt das Rezept als Gericht im Kalorienzaehler an (POST
# /api/internal/recipe-dishes, nur lokal). Der Token ist ein eigener Dienst-Token,
# kein persoenlicher - er kann genau das. Leer heisst: Kochen ohne Healthy.
shopping.healthy.url=${FOOD_URL:http://127.0.0.1:48180}
shopping.healthy.token=${SHOPPING_HEALTHY_TOKEN:}
