      # Einkaufsliste - ein Pfad unter fherrmann.com, keine Subdomain.
      # Eingesetzt von deploy/setup-shopping.sh direkt vor dem /grades/-Block.
      #
      # KEIN Privat-Gate: der Dienst prueft eigene Token (je Person einer),
      # damit eine zweite Person die Liste bedienen kann, ohne den
      # Privat-Cookie zu haben. Alles unter /api/ weist die App selbst ab,
      # wenn kein Token mitkommt.
      location /shopping-list/ {
          proxy_pass http://127.0.0.1:48220;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_redirect off;
      }

